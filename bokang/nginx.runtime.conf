worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  # Build assets have content hashes. Entry documents and unversioned public
  # files revalidate so deployments do not leave users on stale entrypoints.
  map $uri $asset_cache_control {
    default "no-cache";
    ~^/(god-mode/)?assets/ "public, max-age=31536000, immutable";
  }

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/xml application/javascript application/json
             application/xml image/svg+xml application/wasm;

  access_log /dev/stdout;
  error_log /dev/stderr;

  server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Cache-Control $asset_cache_control;

    # A missing script must be a 404, never the SPA HTML fallback.
    location /assets/ {
      try_files $uri =404;
    }

    location /god-mode/assets/ {
      try_files $uri =404;
    }

    # The same runtime Dockerfile packages Admin under ASSET_PATH=/god-mode.
    location /god-mode/ {
      try_files $uri $uri/ /god-mode/index.html;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>使用帮助 · 泊康项目管理系统</title><style>body{font:16px/1.8 system-ui;max-width:760px;margin:64px auto;padding:24px;color:#233044}h1{color:#086b96}a{color:#086b96}</style><h1>泊康项目管理系统</h1><h2>填写任务</h2><p>写清标题、负责人、状态、计划完成日期，以及“要完成什么、怎样算完成”。</p><h2>更新进展与成果</h2><p>在任务评论里说明做了什么、结果、下一步和需要的帮助。图片、视频使用附件，文档和演示地址使用链接。</p><h2>周一汇报</h2><p>周五更新任务；周报概括本周结果、下一阶段、风险与待决策事项，并链接到任务和成果。</p><h2>账号和密码</h2><p>使用管理员提供的账号和密码登录，无需收邮件。知道旧密码可以在个人设置中修改；忘记密码请联系管理员赖星宇。</p><p><a href="/">返回系统</a> · <a href="/open-source.html">开源说明与源码</a></p></html>
